name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Игра не требует сборки: копируем в артефакт только файлы сайта,
      # чтобы в Pages не попали .git, README и служебные файлы репозитория.
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css favicon.svg .nojekyll _site/
          cp -R src vendor _site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Начиная с v4 артефакт по умолчанию отбрасывает скрытые файлы,
          # а сайту нужен .nojekyll — иначе он молча не попадёт в деплой.
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
